name: Docker Build Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t baileys:test .
        
    - name: Test Docker image
      run: |
        docker images | grep baileys
        
    - name: Run container health check
      run: |
        # Start container in detached mode
        docker run -d --name baileys-test baileys:test sleep 30
        
        # Check if container is running
        docker ps | grep baileys-test
        
        # Check container logs
        docker logs baileys-test
        
        # Stop container
        docker stop baileys-test
        docker rm baileys-test
